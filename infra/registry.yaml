AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  InventoryApp image registry (INV-15): ECR repository for the API image, tagged by git commit SHA.
  Deploy with --tags project=inventory.

Parameters:
  Project:
    Type: String
    Default: inventory
    Description: Prefix for resource names and exports.
  ImagesToKeep:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Older images are expired so storage cost stays near zero.

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-api'
      # A tag always means the same build, so a deploy can be traced to its commit and rolled back.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Lets the stack be deleted while it still holds images.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last ${ImagesToKeep} images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": ${ImagesToKeep} },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags: [{ Key: Name, Value: !Sub '${Project}-api' }]

# Exported for the service stack (INV-15) and the GitHub deploy role (INV-16).
Outputs:
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export: { Name: !Sub '${Project}-api-repository-uri' }
  ApiRepositoryArn:
    Value: !GetAtt ApiRepository.Arn
    Export: { Name: !Sub '${Project}-api-repository-arn' }
