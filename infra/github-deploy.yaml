AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  InventoryApp deploy access for GitHub Actions (INV-16): OIDC identity provider and a role that only jobs in the
  repository's sandbox environment can assume, with short-lived credentials and no stored keys. The role can push the
  API image and update the image tag of the inventory-service stack, nothing else.
  Deploy with --capabilities CAPABILITY_NAMED_IAM --tags project=inventory.

Parameters:
  Project:
    Type: String
    Default: inventory
    Description: Prefix for resource names and imports; must match the other stacks.
  GitHubRepository:
    Type: String
    Default: Priyanka-Roy-Dey/Inventory-Management
    Description: owner/name of the repository whose workflows may deploy.
  GitHubEnvironment:
    Type: String
    Default: sandbox
    Description: GitHub environment (with required reviewers) that deploy jobs must run in.

Resources:
  # One per account; GitHub's tokens are verified against it.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-github-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that declare this environment, so every deploy has passed the approval gate.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: push-api-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !ImportValue { 'Fn::Sub': '${Project}-api-repository-arn' }
        - PolicyName: update-api-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-service/*'
              # CloudFormation acts with the caller's permissions: a new image means a new task definition revision.
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DeleteTaskDefinitions
                  - ecs:DescribeTaskDefinition
                  - ecs:TagResource
                Resource: '*'
              - Effect: Allow
                Action: ['ecs:UpdateService', 'ecs:DescribeServices']
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Project}/${Project}-api'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Project}-api-execution'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Project}-api-task'
                Condition:
                  StringEquals: { 'iam:PassedToService': ecs-tasks.amazonaws.com }
      Tags: [{ Key: Name, Value: !Sub '${Project}-github-deploy' }]

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable of the GitHub sandbox environment.
    Value: !GetAtt DeployRole.Arn
