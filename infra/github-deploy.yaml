AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  InventoryApp deploy access for GitHub Actions (INV-16): a role, trusted through the account's GitHub OIDC provider,
  that only jobs in the repository's sandbox environment can assume, with short-lived credentials and no stored keys. The role can push the
  API image, update the image tag of the inventory-service stack and publish the web app (INV-24), nothing else.
  Needs the registry and frontend stacks. Deploy with --capabilities CAPABILITY_NAMED_IAM --tags project=inventory.

Parameters:
  Project:
    Type: String
    Default: inventory
    Description: Prefix for resource names and imports; must match the other stacks.
  GitHubRepository:
    Type: String
    Default: Priyanka-Roy-Dey@36127173/Inventory-Management@1439440613
    Description: >-
      The repository as GitHub names it in the token's sub claim: owner@ownerId/name@repositoryId. The ids pin this
      exact repository, so a re-created repository with the same name cannot deploy.
  GitHubEnvironment:
    Type: String
    Default: sandbox
    Description: GitHub environment (with required reviewers) that deploy jobs must run in.

Resources:
  # Uses the account's GitHub OIDC provider instead of creating one: an account can only have one per URL, and it
  # already exists here. Create it once with `aws iam create-open-id-connect-provider` in a fresh account.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-github-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com' }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that declare this environment, so every deploy has passed the approval gate.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: push-api-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !ImportValue { 'Fn::Sub': '${Project}-api-repository-arn' }
        - PolicyName: update-api-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-service/*'
              # CloudFormation acts with the caller's permissions: a new image means a new task definition revision.
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DeleteTaskDefinitions
                  - ecs:DescribeTaskDefinition
                  - ecs:TagResource
                Resource: '*'
              - Effect: Allow
                Action: ['ecs:UpdateService', 'ecs:DescribeServices']
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Project}/${Project}-api'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Project}-api-execution'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Project}-api-task'
                Condition:
                  StringEquals: { 'iam:PassedToService': ecs-tasks.amazonaws.com }
              # CloudFormation reads the roles to resolve !GetAtt ...Arn for the new task definition.
              - Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Project}-api-execution'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Project}-api-task'
              # CloudFormation reads the load balancer and target group for the stack's outputs (ApiUrl, and the
              # CloudWatch names monitoring.yaml uses). Read-only, and these actions cannot be limited to one resource.
              - Effect: Allow
                Action: ['elasticloadbalancing:DescribeLoadBalancers', 'elasticloadbalancing:DescribeTargetGroups']
                Resource: '*'
        - PolicyName: publish-web-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # deploy.yml reads the bucket and distribution from the frontend stack's outputs.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-frontend/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue { 'Fn::Sub': '${Project}-web-bucket-arn' }
              - Effect: Allow
                Action: ['s3:PutObject', 's3:DeleteObject']
                Resource: !Sub
                  - '${BucketArn}/*'
                  - BucketArn: !ImportValue { 'Fn::Sub': '${Project}-web-bucket-arn' }
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub
                  - 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
                  - DistributionId: !ImportValue { 'Fn::Sub': '${Project}-web-distribution-id' }
      Tags: [{ Key: Name, Value: !Sub '${Project}-github-deploy' }]

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable of the GitHub sandbox environment.
    Value: !GetAtt DeployRole.Arn
