name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Keep coverage for SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 3

      - name: Build
        run: npm run build

  api:
    name: API - test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: api/pom.xml

      # Runs the unit tests and the Testcontainers tests (the runner has Docker), then packages the jar.
      - name: Test and build
        run: ./mvnw -B verify

      # Compiled classes and the JaCoCo report, for the SonarCloud job.
      - name: Keep coverage for SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: |
            api/target/classes
            api/target/test-classes
            api/target/site/jacoco/jacoco.xml
          retention-days: 3

  sonarcloud:
    name: SonarCloud - quality gate
    needs: [web, api]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Skipped until the repository has a SONAR_TOKEN secret, so CI stays green before SonarCloud is set up.
      - name: Check for the SonarCloud token
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; skipping the SonarCloud analysis."

      - name: Check out code
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v5
        with:
          # Full history, so SonarCloud can tell which lines are new in this pull request.
          fetch-depth: 0

      - name: Get web coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: web-coverage
          path: web/coverage

      - name: Get API classes and coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: api-coverage
          path: api/target

      - name: Analyse and check the quality gate
        if: env.SONAR_TOKEN != ''
        # Third-party action pinned to an exact commit (v8.4.1), so the tag cannot be moved under us.
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Wait for the result, so this check fails when the quality gate fails.
          args: -Dsonar.qualitygate.wait=true

