name: Deploy

# INV-16: after CI passes on main, build the API image, push it to ECR and roll it out to the sandbox.
# The job runs in the "sandbox" environment, so it waits for a required reviewer to approve it, and only that
# environment can assume the AWS deploy role (infra/github-deploy.yaml).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer merge waits instead of cancelling one that is rolling out.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy to sandbox
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: sandbox
      url: ${{ steps.web.outputs.web_url }}
    env:
      AWS_REGION: eu-north-1
      REPOSITORY: inventory-api
      STACK: inventory-service
      WEB_STACK: inventory-frontend
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Image tag from the commit
        run: echo "TAG=${HEAD_SHA::12}" >> "$GITHUB_ENV"

      - name: AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push the image
        run: |
          REPO_URI=$(aws ecr describe-repositories --repository-names "$REPOSITORY" --query 'repositories[0].repositoryUri' --output text)
          echo "REPO_URI=$REPO_URI" >> "$GITHUB_ENV"
          # Tags are immutable, so a re-run of the same commit reuses the image it already pushed.
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "::notice::Image $TAG already in ECR; not rebuilding."
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
          docker build --pull -t "$REPO_URI:$TAG" api
          docker push "$REPO_URI:$TAG"

      - name: Stop on HIGH or CRITICAL vulnerabilities
        run: |
          # Not `aws ecr wait image-scan-complete`: it gives up on the ScanNotFoundException ECR returns for a few
          # seconds after a push, before the scan exists.
          for attempt in $(seq 1 30); do
            SCAN=$(aws ecr describe-image-scan-findings --repository-name "$REPOSITORY" --image-id imageTag="$TAG" \
              --query 'imageScanStatus.status' --output text 2>&1) || SCAN="not started yet ($SCAN)"
            case "$SCAN" in
              COMPLETE) break ;;
              FAILED|UNSUPPORTED_IMAGE) echo "::error::Scan of $TAG ended $SCAN; not deploying."; exit 1 ;;
            esac
            echo "Scan of $TAG: $SCAN"
            sleep 10
          done
          if [ "$SCAN" != COMPLETE ]; then
            echo "::error::Scan of $TAG did not complete within 5 minutes; not deploying."
            exit 1
          fi
          COUNTS=$(aws ecr describe-image-scan-findings --repository-name "$REPOSITORY" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts' --output json)
          echo "Scan findings: $COUNTS"
          BLOCKING=$(echo "$COUNTS" | jq '(.CRITICAL // 0) + (.HIGH // 0)')
          if [ "$BLOCKING" -gt 0 ]; then
            echo "::error::Image $TAG has $BLOCKING HIGH/CRITICAL findings; not deploying."
            exit 1
          fi

      - name: Roll out the new image
        run: |
          # Only the image tag changes; infrastructure changes to infra/service.yaml are deployed by hand.
          set +e
          OUTPUT=$(aws cloudformation update-stack --stack-name "$STACK" --use-previous-template \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters ParameterKey=ImageTag,ParameterValue="$TAG" \
              ParameterKey=Project,UsePreviousValue=true \
              ParameterKey=JwtKeySecretArn,UsePreviousValue=true \
              ParameterKey=AdminSecretArn,UsePreviousValue=true \
              ParameterKey=DesiredCount,UsePreviousValue=true \
              ParameterKey=Cpu,UsePreviousValue=true \
              ParameterKey=Memory,UsePreviousValue=true 2>&1)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "No updates are to be performed"; then
              echo "::notice::$STACK already runs $TAG."
              exit 0
            fi
            echo "$OUTPUT"
            exit $STATUS
          fi
          # Fails if the ECS circuit breaker rolls the deployment back; then show why. A failed resource says so on
          # its own event; a failure outside any resource (an output, say) is only on the stack's rollback event.
          if ! aws cloudformation wait stack-update-complete --stack-name "$STACK"; then
            aws cloudformation describe-stack-events --stack-name "$STACK" --max-items 40 \
              --query "StackEvents[?contains(ResourceStatus,'FAILED') || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS'] | [:5].[LogicalResourceId,ResourceStatusReason]" --output text
            echo "::error::$STACK update failed and was rolled back; still running the previous image."
            exit 1
          fi

      - name: Smoke test through the load balancer
        id: smoke
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$API_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "API is UP at $API_URL running $TAG"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$API_URL/actuator/health did not report UP"
          exit 1

      # INV-24: the web app goes out after the API it calls is up.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish the web app to S3 and CloudFront
        id: web
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          BUCKET=$(output SiteBucketName)
          DISTRIBUTION_ID=$(output DistributionId)
          WEB_URL=$(output WebUrl)
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          # Asset names change with their content, so browsers may keep them, and old ones stay for pages still open;
          # index.html must be re-checked every time.
          aws s3 sync web/dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync web/dist "s3://$BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/" > /dev/null

      - name: Smoke test through CloudFront
        run: |
          WEB_URL="${{ steps.web.outputs.web_url }}"
          curl -fsS "$WEB_URL/" | grep -q '<div id="root">'
          # /api/* must reach the API: without a token it answers 401, not CloudFront's or S3's 403/404.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/api/items")
          if [ "$STATUS" != 401 ]; then
            echo "::error::$WEB_URL/api/items returned $STATUS, expected 401 from the API"
            exit 1
          fi
          echo "Web app and API are up at $WEB_URL"
