spring.application.name=inventory-api

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Lifetime of access tokens returned by POST /api/auth/login.
inventory.jwt.access-token-ttl=15m

# Lifetime of single-use refresh tokens returned with each access token.
inventory.jwt.refresh-token-ttl=7d

# Item images (A36). Locally the S3Mock container from compose.yaml; in AWS leave the endpoint empty to use S3.
inventory.images.bucket=inventory-images
inventory.images.endpoint=http://localhost:9090
inventory.images.region=us-east-1
inventory.images.max-size=2MB
inventory.images.url-ttl=10m

# CSV import limit (A8): 10 MB per file.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
