# SonarCloud analysis for the whole repository (INV-7). The quality gate is SonarCloud's default "Sonar way",
# which includes at least 80% coverage on new code (stricter than the ticket's 70%).
# organization and projectKey are the values SonarCloud shows after importing the repository.
sonar.organization=priyanka-roy-dey
sonar.projectKey=Priyanka-Roy-Dey_Inventory-Management
sonar.projectName=InventoryApp
sonar.sourceEncoding=UTF-8

sonar.sources=api/src/main,web/src
sonar.tests=api/src/test,web/src
sonar.exclusions=web/src/**/*.test.js,web/src/**/*.test.jsx,web/src/test/**
sonar.test.inclusions=web/src/**/*.test.js,web/src/**/*.test.jsx,web/src/test/**,api/src/test/**

sonar.java.source=17
sonar.java.binaries=api/target/classes
sonar.java.test.binaries=api/target/test-classes

# Reports written by the CI jobs (./mvnw verify and npm run test:coverage).
sonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.coverage.exclusions=web/src/main.jsx,api/src/main/java/com/inventory/api/InventoryApiApplication.java
